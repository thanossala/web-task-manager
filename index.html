<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Task Manager Pro</title>
  <style>
    :root {
      --bg: #f8fafc;
      --card: #ffffff;
      --text: #0f172a;
      --muted: #64748b;
      --accent: #2563eb;
      --accent-hover: #1d4ed8;
      --border: #e2e8f0;
      --danger: #ef4444;
      --success: #10b981;
      --shadow: 0 1px 3px 0 rgb(0 0 0 / 0.1), 0 1px 2px -1px rgb(0 0 0 / 0.1);
      --radius: 12px;
      --transition: all 0.2s ease-in-out;
    }

    .dark {
      --bg: #090d16;
      --card: #131c2e;
      --text: #f8fafc;
      --muted: #94a3b8;
      --border: #22314d;
      --shadow: 0 4px 6px -1px rgb(0 0 0 / 0.2);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      transition: background-color var(--transition);
      line-height: 1.5;
    }

    .wrap {
      max-width: 900px;
      margin: 40px auto;
      padding: 0 24px;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 32px;
    }

    h1 {
      font-size: 28px;
      font-weight: 700;
      letter-spacing: -0.5px;
    }

    /* Forms & Controls */
    .controls-row {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      margin-bottom: 24px;
    }

    input, select, button {
      font-family: inherit;
      font-size: 14px;
      padding: 10px 16px;
      border-radius: var(--radius);
      border: 1px solid var(--border);
      background: var(--card);
      color: var(--text);
      outline: none;
      transition: var(--transition);
    }

    input:focus, select:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.15);
    }

    input#title { flex: 2; min-width: 200px; }

    button {
      font-weight: 500;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }

    button.primary {
      background: var(--accent);
      color: white;
      border: none;
    }

    button.primary:hover { background: var(--accent-hover); }

    button.secondary {
      background: var(--card);
      border: 1px solid var(--border);
    }
    
    button.secondary:hover {
      background: var(--bg);
    }

    /* Stats Grid */
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
      gap: 16px;
      margin-bottom: 24px;
    }

    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 20px;
      box-shadow: var(--shadow);
    }

    .card h3 {
      font-size: 13px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: var(--muted);
      margin-bottom: 8px;
    }

    .stat-val {
      font-size: 28px;
      font-weight: 700;
    }

    /* Progress bar */
    .progress-wrapper {
      padding: 16px 20px;
      margin-bottom: 24px;
    }
    
    .progress {
      height: 8px;
      background: var(--border);
      border-radius: 999px;
      overflow: hidden;
    }

    .progress > div {
      height: 100%;
      background: var(--accent);
      width: 0%;
      transition: width 0.4s cubic-bezier(0.4, 0, 0.2, 1);
    }

    /* Toolbar Filter Section */
    .toolbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 16px;
      margin-bottom: 16px;
    }

    .search-box { position: relative; flex: 1; min-width: 250px; }
    .search-box input { width: 100%; }

    .filters { display: flex; gap: 4px; }
    .filter-btn {
      background: transparent;
      border: none;
      padding: 6px 12px;
      font-size: 13px;
      color: var(--muted);
    }
    .filter-btn.active {
      background: var(--border);
      color: var(--text);
    }

    /* Task List Items */
    .task-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .task {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 16px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      animation: fadeIn 0.2s ease-out;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(4px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .task-meta {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .task-title {
      font-weight: 500;
      transition: var(--transition);
    }

    .task-title.done {
      text-decoration: line-through;
      color: var(--muted);
      opacity: 0.7;
    }

    .task-details {
      font-size: 12px;
      color: var(--muted);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .badge {
      padding: 2px 8px;
      border-radius: 4px;
      font-weight: 600;
      font-size: 11px;
      text-transform: uppercase;
    }
    .badge.high { background: rgba(239, 68, 68, 0.1); color: var(--danger); }
    .badge.medium { background: rgba(245, 158, 11, 0.1); color: #d97706; }
    .badge.low { background: rgba(99, 102, 241, 0.1); color: #4f46e5; }

    .actions { display: flex; gap: 8px; }
    
    .btn-icon {
      padding: 8px;
      border-radius: 8px;
      background: transparent;
      border: 1px solid transparent;
      color: var(--muted);
    }
    .btn-icon:hover {
      background: var(--bg);
      color: var(--text);
    }
    .btn-icon.btn-done:hover { color: var(--success); }
    .btn-icon.btn-del:hover { color: var(--danger); }

    .empty-state {
      text-align: center;
      padding: 40px 20px;
      color: var(--muted);
      font-size: 14px;
    }
  </style>
</head>
<body>

<div class="wrap">
  <header>
    <h1>Task Manager Pro</h1>
    <button id="themeToggle" class="secondary" aria-label="Toggle Theme">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/></svg>
      Theme
    </button>
  </header>

  <div class="controls-row">
    <input id="titleInput" placeholder="What needs to be done?" autocomplete="off">
    <select id="priorityInput">
      <option value="Low">Low</option>
      <option value="Medium" selected>Medium</option>
      <option value="High">High</option>
    </select>
    <input id="dueInput" type="date">
    <button id="addBtn" class="primary">Add Task</button>
  </div>

  <div class="grid">
    <div class="card"><h3>Total</h3><div id="totalStat" class="stat-val">0</div></div>
    <div class="card"><h3>Completed</h3><div id="doneStat" class="stat-val">0</div></div>
    <div class="card"><h3>Pending</h3><div id="pendingStat" class="stat-val">0</div></div>
    <div class="card"><h3>Completion</h3><div id="pctStat" class="stat-val">0%</div></div>
  </div>

  <div class="card progress-wrapper">
    <div class="progress"><div id="progressBar"></div></div>
  </div>

  <div class="toolbar">
    <div class="search-box">
      <input id="searchInput" placeholder="Search tasks...">
    </div>
    <div class="filters">
      <button class="filter-btn active" data-filter="all">All</button>
      <button class="filter-btn" data-filter="active">Active</button>
      <button class="filter-btn" data-filter="completed">Completed</button>
    </div>
  </div>

  <div id="taskList" class="task-list"></div>
</div>

<script>
  // State Management
  let tasks = JSON.parse(localStorage.getItem('tasks_pro') || '[]');
  let currentFilter = 'all';

  // DOM Elements
  const titleInput = document.getElementById('titleInput');
  const priorityInput = document.getElementById('priorityInput');
  const dueInput = document.getElementById('dueInput');
  const addBtn = document.getElementById('addBtn');
  const searchInput = document.getElementById('searchInput');
  const taskList = document.getElementById('taskList');
  const themeToggle = document.getElementById('themeToggle');

  // Initialization & Theme Handling
  if (localStorage.getItem('theme') === 'dark') {
    document.documentElement.classList.add('dark');
  }

  themeToggle.addEventListener('click', () => {
    const isDark = document.documentElement.classList.toggle('dark');
    localStorage.setItem('theme', isDark ? 'dark' : 'light');
  });

  // Event Listeners
  addBtn.addEventListener('click', addTask);
  titleInput.addEventListener('keypress', (e) => { if (e.key === 'Enter') addTask(); });
  searchInput.addEventListener('input', render);

  document.querySelectorAll('.filter-btn').forEach(btn => {
    btn.addEventListener('click', (e) => {
      document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
      e.target.classList.add('active');
      currentFilter = e.target.getAttribute('data-filter');
      render();
    });
  });

  // Actions
  function save() {
    localStorage.setItem('tasks_pro', JSON.stringify(tasks));
  }

  function addTask() {
    const text = titleInput.value.trim();
    if (!text) return;

    tasks.unshift({
      id: Date.now(),
      title: text,
      priority: priorityInput.value,
      due: dueInput.value,
      done: false
    });

    titleInput.value = '';
    dueInput.value = '';
    priorityInput.value = 'Medium';
    save();
    render();
  }

  function toggleTask(id) {
    const task = tasks.find(t => t.id === id);
    if (task) task.done = !task.done;
    save();
    render();
  }

  function deleteTask(id) {
    tasks = tasks.filter(t => t.id !== id);
    save();
    render();
  }

  // Formatting helpers
  function formatDate(dateStr) {
    if (!dateStr) return '';
    const date = new Date(dateStr);
    return date.toLocaleDateString(undefined, { month: 'short', day: 'numeric', year: 'numeric' });
  }

  // Rendering engine
  function render() {
    const query = searchInput.value.toLowerCase();
    
    // Process filtering
    let filteredTasks = tasks.filter(t => t.title.toLowerCase().includes(query));
    if (currentFilter === 'active') filteredTasks = filteredTasks.filter(t => !t.done);
    if (currentFilter === 'completed') filteredTasks = filteredTasks.filter(t => t.done);

    // Render List Items
    if (filteredTasks.length === 0) {
      taskList.innerHTML = `<div class="empty-state">No tasks found</div>`;
    } else {
      taskList.innerHTML = filteredTasks.map(t => `
        <div class="task">
          <div class="task-meta">
            <div class="task-title ${t.done ? 'done' : ''}">${escapeHTML(t.title)}</div>
            <div class="task-details">
              <span class="badge ${t.priority.toLowerCase()}">${t.priority}</span>
              ${t.due ? `<span>• Due ${formatDate(t.due)}</span>` : ''}
            </div>
          </div>
          <div class="actions">
            <button class="btn-icon btn-done" onclick="toggleTask(${t.id})" aria-label="Toggle Complete">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="20 6 9 17 4 12"/></svg>
            </button>
            <button class="btn-icon btn-del" onclick="deleteTask(${t.id})" aria-label="Delete Task">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>
            </button>
          </div>
        </div>
      `).join('');
    }

    // Update Dashboard Metrics
    const totalN = tasks.length;
    const doneN = tasks.filter(t => t.done).length;
    const pendingN = totalN - doneN;
    const pct = totalN ? Math.round((doneN * 100) / totalN) : 0;

    document.getElementById('totalStat').textContent = totalN;
    document.getElementById('doneStat').textContent = doneN;
    document.getElementById('pendingStat').textContent = pendingN;
    document.getElementById('pctStat').textContent = pct + '%';
    document.getElementById('progressBar').style.width = pct + '%';
  }

  // Security Helper to avoid XSS injection
  function escapeHTML(str) {
    return str.replace(/[&<>'"]/g, 
      tag => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[tag] || tag)
    );
  }

  // Initial Run
  render();
</script>
</body>
</html>
