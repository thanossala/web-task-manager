<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Task Manager Pro</title>
<style>
:root{--bg:#f4f7fb;--card:#fff;--text:#1b2430;--muted:#667085;--accent:#2563eb;--border:#dfe4ea}
.dark{--bg:#0f172a;--card:#111827;--text:#f8fafc;--muted:#94a3b8;--border:#334155}
*{box-sizing:border-box}body{margin:0;font-family:system-ui;background:var(--bg);color:var(--text)}
.wrap{max-width:1000px;margin:auto;padding:24px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}
.card{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:16px}
input,select,button{padding:10px;border-radius:10px;border:1px solid var(--border)}
button{cursor:pointer}
.row{display:flex;gap:10px;flex-wrap:wrap}
.task{display:flex;justify-content:space-between;align-items:center;margin:8px 0;padding:12px;border:1px solid var(--border);border-radius:12px}
.done{text-decoration:line-through;opacity:.6}
.progress{height:10px;background:#cbd5e1;border-radius:999px;overflow:hidden}
.progress>div{height:100%;background:var(--accent)}
</style>
</head>
<body>
<div class="wrap">
<h1>🚀 Task Manager Pro</h1>
<div class="row">
<input id="title" placeholder="Task title" style="flex:2">
<select id="priority"><option>Low</option><option>Medium</option><option>High</option></select>
<input id="due" type="date">
<button onclick="add()">Add Task</button>
<button onclick="document.documentElement.classList.toggle('dark')">Theme</button>
</div><br>

<div class="grid">
<div class="card"><h3>Total</h3><div id="total">0</div></div>
<div class="card"><h3>Completed</h3><div id="done">0</div></div>
<div class="card"><h3>Pending</h3><div id="pending">0</div></div>
<div class="card"><h3>Completion</h3><div id="pct">0%</div></div>
</div><br>

<div class="card">
<div class="progress"><div id="bar" style="width:0%"></div></div>
</div><br>

<div class="card">
<input id="search" placeholder="Search tasks..." oninput="render()" style="width:100%">
<div id="list"></div>
</div>
</div>

<script>
let tasks=JSON.parse(localStorage.getItem('tasks_pro')||'[]');
function save(){localStorage.setItem('tasks_pro',JSON.stringify(tasks));}
function add(){
 const t=title.value.trim(); if(!t) return;
 tasks.unshift({id:Date.now(),title:t,priority:priority.value,due:due.value,done:false});
 title.value=''; due.value=''; save(); render();
}
function toggle(id){let t=tasks.find(x=>x.id===id); t.done=!t.done; save(); render();}
function del(id){tasks=tasks.filter(t=>t.id!==id); save(); render();}
function render(){
 const q=search.value.toLowerCase();
 const view=tasks.filter(t=>t.title.toLowerCase().includes(q));
 list.innerHTML=view.map(t=>`<div class="task">
 <div>
 <div class="${t.done?'done':''}">${t.title}</div>
 <small>${t.priority} ${t.due?('• '+t.due):''}</small>
 </div>
 <div>
 <button onclick="toggle(${t.id})">✓</button>
 <button onclick="del(${t.id})">🗑</button>
 </div></div>`).join('');
 let totalN=tasks.length, doneN=tasks.filter(t=>t.done).length;
 total.textContent=totalN; done.textContent=doneN;
 pending.textContent=totalN-doneN;
 let p=totalN?Math.round(doneN*100/totalN):0;
 pct.textContent=p+'%'; bar.style.width=p+'%';
}
render();
</script>
</body>
</html>
